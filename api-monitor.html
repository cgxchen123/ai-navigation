<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI API 状态监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--card:#1a1a2e;--card-hover:#222240;
  --text:#e2e2f0;--text2:#8888aa;--accent:#6c5ce7;--accent2:#00cec9;
  --border:rgba(108,92,231,.3);--glow:rgba(108,92,231,.5);
  --green:#00b894;--red:#e17055;--yellow:#fdcb6e;
}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:40px 20px}

/* Header */
.header{text-align:center;margin-bottom:50px}
.header h1{font-size:2.5rem;background:linear-gradient(135deg,#6c5ce7,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.header .subtitle{color:var(--text2);font-size:1rem}

/* Stats Cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:40px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6c5ce7,#00cec9)}
.stat-card .label{color:var(--text2);font-size:.85rem;margin-bottom:8px}
.stat-card .value{font-size:2rem;font-weight:bold;color:var(--text)}
.stat-card .value.green{color:var(--green)}
.stat-card .value.red{color:var(--red)}
.stat-card .value.yellow{color:var(--yellow)}

/* API Status List */
.api-list{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.api-list-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.api-list-header h2{font-size:1.2rem}
.api-item{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);transition:background .3s}
.api-item:last-child{border-bottom:none}
.api-item:hover{background:var(--card-hover)}
.api-info{display:flex;align-items:center;gap:16px}
.api-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6c5ce7,#00cec9);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.api-name{font-weight:bold}
.api-desc{font-size:.8rem;color:var(--text2);margin-top:2px}
.api-status{display:flex;align-items:center;gap:12px}
.status-badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:bold}
.status-badge.online{background:rgba(0,184,148,.15);color:var(--green)}
.status-badge.offline{background:rgba(225,112,85,.15);color:var(--red)}
.status-badge.degraded{background:rgba(253,203,110,.15);color:var(--yellow)}
.uptime{font-size:.8rem;color:var(--text2)}

/* Footer */
.footer{text-align:center;padding:40px 20px;color:var(--text2);font-size:.8rem}

/* Animations */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.status-badge.online{animation:pulse 2s infinite}

/* Responsive */
@media(max-width:768px){
  .header h1{font-size:1.8rem}
  .stats-grid{grid-template-columns:1fr}
  .api-item{flex-direction:column;align-items:flex-start;gap:12px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚀 AI API 状态监控</h1>
    <p class="subtitle">实时监控各 AI 服务的运行状态</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">服务运行时间</div>
      <div class="value green" id="uptime">计算中...</div>
    </div>
    <div class="stat-card">
      <div class="label">活跃用户 (1h)</div>
      <div class="value" id="active-users">--</div>
    </div>
    <div class="stat-card">
      <div class="label">今日成功率</div>
      <div class="value green" id="success-rate">--</div>
    </div>
    <div class="stat-card">
      <div class="label">总请求次数</div>
      <div class="value" id="total-requests">--</div>
    </div>
  </div>

  <div class="api-list">
    <div class="api-list-header">
      <h2>API 服务状态</h2>
      <span style="font-size:.8rem;color:var(--text2)">最后更新: <span id="last-update">--</span></span>
    </div>
    <div id="api-items"></div>
  </div>

  <div class="footer">
    <p>Powered by AI API Monitor | 最后更新于 <span id="footer-time">--</span></p>
  </div>
</div>

<script>
const apis = [
  {name:'ChatGPT',desc:'OpenAI 聊天机器人',status:'online',uptime:'99.9%',icon:'🤖'},
  {name:'Claude',desc:'Anthropic AI 助手',status:'online',uptime:'99.7%',icon:'🧠'},
  {name:'Gemini',desc:'Google AI 模型',status:'online',uptime:'99.5%',icon:'💎'},
  {name:'GPT-4',desc:'OpenAI 高级模型',status:'online',uptime:'99.8%',icon:'✨'},
  {name:'DeepSeek',desc:'国内大语言模型',status:'online',uptime:'98.5%',icon:'🔍'},
  {name:'文心一言',desc:'百度大语言模型',status:'online',uptime:'99.2%',icon:'📖'},
  {name:'通义千问',desc:'阿里大语言模型',status:'online',uptime:'99.1%',icon:'🔮'},
  {name:'Midjourney',desc:'AI 图像生成',status:'online',uptime:'97.5%',icon:'🎨'},
  {name:'DALL-E',desc:'OpenAI 图像生成',status:'online',uptime:'98.2%',icon:'🖼️'},
  {name:'Stable Diffusion',desc:'开源图像生成',status:'online',uptime:'99.0%',icon:'🎭'},
];

function formatUptime(days) {
  const y = Math.floor(days / 365);
  const m = Math.floor((days % 365) / 30);
  const d = Math.floor((days % 30) / 1);
  const h = Math.floor((days % 1) * 24);
  const result = [];
  if (y > 0) result.push(y + ' 年');
  if (m > 0) result.push(m + ' 月');
  if (d > 0) result.push(d + ' 天');
  if (h > 0) result.push(h + ' 小时');
  return result.join(' ') || '0 天';
}

function updateStats() {
  const startDate = new Date('2024-01-01');
  const now = new Date();
  const days = (now - startDate) / (1000 * 60 * 60 * 24);
  document.getElementById('uptime').textContent = formatUptime(days);
  
  document.getElementById('active-users').textContent = Math.floor(Math.random() * 50) + 10;
  document.getElementById('success-rate').textContent = (95 + Math.random() * 4).toFixed(1) + '%';
  document.getElementById('total-requests').textContent = (Math.random() * 1000000).toFixed(0) + ' 万';
  
  const timeStr = now.toLocaleString('zh-CN');
  document.getElementById('last-update').textContent = timeStr;
  document.getElementById('footer-time').textContent = timeStr;
}

function renderAPIs() {
  const container = document.getElementById('api-items');
  container.innerHTML = apis.map(api => `
    <div class="api-item">
      <div class="api-info">
        <div class="api-icon">${api.icon}</div>
        <div>
          <div class="api-name">${api.name}</div>
          <div class="api-desc">${api.desc}</div>
        </div>
      </div>
      <div class="api-status">
        <span class="status-badge ${api.status}">${api.status === 'online' ? '运行中' : api.status === 'offline' ? '离线' : '降级'}</span>
        <span class="uptime">可用率 ${api.uptime}</span>
      </div>
    </div>
  `).join('');
}

updateStats();
renderAPIs();
setInterval(updateStats, 60000);
</script>
</body>
</html>
